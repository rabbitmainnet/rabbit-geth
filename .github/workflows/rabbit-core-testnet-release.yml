name: Rabbit Core Testnet V2 Release

on:
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: Existing successful build run ID to publish
        required: false
        type: string

env:
  GO_VERSION: "1.25.13"
  RANDOMX_REPOSITORY: https://github.com/tevador/RandomX.git
  RANDOMX_COMMIT: 7c761cf007c758056dcb6eb438a32f780f81bdbd
  TESTNET_GENESIS_SHA256: 17bfe51321f6e7befe8719ee35c34b1b876fda3e93672204903bd7b6d6bb69ba

jobs:
  native:
    if: ${{ inputs.publish_run_id == '' }}
    name: ${{ matrix.target }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
            archive: tar.gz
          - target: windows-amd64
            runner: windows-2022
            archive: zip
          - target: darwin-arm64
            runner: macos-15
            archive: tar.gz
          - target: darwin-amd64
            runner: macos-15-intel
            archive: tar.gz

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out Rabbit Chain
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake nasm

      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install cmake nasm

      - name: Build Unix package
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: bash
        env:
          RABBIT_TARGET: ${{ matrix.target }}
        run: scripts/rabbit-release/build-rabbit-core-native.sh

      - name: Build Windows package
        if: runner.os == 'Windows'
        shell: powershell
        env:
          RABBIT_TARGET: ${{ matrix.target }}
        run: scripts/rabbit-release/build-rabbit-core-windows.ps1

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: rabbit-core-testnet-v2.4.4-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  manifest:
    name: Release manifest
    needs: native
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: rabbit-core-testnet-v2.4.4-*
          path: releases
          merge-multiple: true

      - name: Create aggregate checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          cd releases
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' \
            | LC_ALL=C sort \
            | while IFS= read -r file; do sha256sum "$file"; done \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: rabbit-core-testnet-v2.4.4-release-bundle
          path: releases/*
          if-no-files-found: error
          retention-days: 30


  publish-existing:
    name: Publish existing V2.4.4 artifacts
    if: ${{ inputs.publish_run_id != '' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Verify build source before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.publish_run_id }}
        run: |
          set -Eeuo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          read -r status conclusion source_sha < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" \
              --jq '[.status, .conclusion, .head_sha] | @tsv'
          )
          [[ "$status" == completed ]]
          [[ "$conclusion" == success ]]
          [[ "$source_sha" == "$GITHUB_SHA" ]]

      - name: Download verified V2.4.4 bundle
        uses: actions/download-artifact@v4
        with:
          name: rabbit-core-testnet-v2.4.4-release-bundle
          path: release
          github-token: ${{ github.token }}
          repository: rabbitmainnet/rabbit-geth
          run-id: ${{ inputs.publish_run_id }}

      - name: Verify bundle
        shell: bash
        run: |
          cd release
          sha256sum -c SHA256SUMS.txt

      - name: Publish V2.4.4 GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.4.4"
          TARGET="$GITHUB_SHA"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title "Rabbit Core Testnet v2.4.4" \
              --draft
          fi

          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
