name: Rabbit Core Testnet Native Preview

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25.13"
  RANDOMX_REPOSITORY: https://github.com/tevador/RandomX.git
  RANDOMX_COMMIT: 7c761cf007c758056dcb6eb438a32f780f81bdbd
  TESTNET_GENESIS_SHA256: 8562725483c8e139083d2858ff1c10cec0e1d09bc399439d5022d4cad9e5a4a7

jobs:
  native:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
            archive: tar.gz
          - target: windows-amd64
            runner: windows-2022
            archive: zip
          - target: macos-amd64
            runner: macos-15-intel
            archive: tar.gz
          - target: macos-arm64
            runner: macos-15
            archive: tar.gz

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out Rabbit Chain
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake nasm

      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: brew install cmake nasm

      - name: Build Unix package
        if: runner.os != 'Windows'
        shell: bash
        env:
          RABBIT_TARGET: ${{ matrix.target }}
        run: scripts/rabbit-release/build-rabbit-core-native.sh

      - name: Build Windows package
        if: runner.os == 'Windows'
        shell: powershell
        env:
          RABBIT_TARGET: ${{ matrix.target }}
        run: scripts/rabbit-release/build-rabbit-core-windows.ps1

      - name: Upload native preview
        uses: actions/upload-artifact@v4
        with:
          name: rabbit-core-testnet-${{ matrix.target }}-preview
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  manifest:
    name: Preview manifest
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - name: Download previews
        uses: actions/download-artifact@v4
        with:
          pattern: rabbit-core-testnet-*-preview
          path: previews
          merge-multiple: true

      - name: Create aggregate checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          cd previews
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' \
            | LC_ALL=C sort \
            | while IFS= read -r file; do sha256sum "$file"; done \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: rabbit-core-testnet-native-preview-bundle
          path: previews/*
          if-no-files-found: error
          retention-days: 14
