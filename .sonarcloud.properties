# Rabbit Chain SonarQube Cloud automatic-analysis configuration.
# Test fixtures remain in the repository but are classified as test code.
# Only nested CI workflows belonging to the vendored secp256k1 dependency
# are excluded from Rabbit Chain's production-code analysis.

sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

sonar.test.inclusions=**/*_test.go,**/testdata/**,tests/**,**/tests/**,**/test_*.py,**/*_test.py,**/tests_*.py,cmd/rabbit-*-benchmark/**,crypto/secp256k1/libsecp256k1/src/bench_*.c

sonar.exclusions=crypto/secp256k1/libsecp256k1/.github/workflows/**,crypto/secp256k1/libsecp256k1/ci/**
